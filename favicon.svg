<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fondo -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>
  
  <!-- Círculo central (nodo principal) -->
  <circle cx="32" cy="32" r="8" fill="#38bdf8"/>
  
  <!-- Nodos secundarios -->
  <circle cx="16" cy="18" r="5" fill="#0ea5e9"/>
  <circle cx="48" cy="18" r="5" fill="#0ea5e9"/>
  <circle cx="16" cy="46" r="5" fill="#0ea5e9"/>
  <circle cx="48" cy="46" r="5" fill="#0ea5e9"/>
  
  <!-- Líneas de conexión -->
  <line x1="32" y1="32" x2="16" y2="18" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="48" y2="18" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="16" y2="46" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="48" y2="46" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Pequeños puntos de acento -->
  <circle cx="32" cy="14" r="2" fill="#67e8f9"/>
  <circle cx="32" cy="50" r="2" fill="#67e8f9"/>
  <circle cx="14" cy="32" r="2" fill="#67e8f9"/>
  <circle cx="50" cy="32" r="2" fill="#67e8f9"/>
</svg>